<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact – CLEOPARD</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="page-head"><div class="container"><h1>Contact</h1></div></div>
<div class="breadcrumb"><div class="container"><a href="index.html">Accueil</a> <span>›</span> Contact</div></div>
<div class="section"><div class="container">
<form id="contactForm" class="form" novalidate>
<div class="field"><label for="nom">Nom</label><input id="nom" name="nom"><span class="err" data-e="nom"></span></div>
<div class="field"><label for="prenom">Prénom</label><input id="prenom" name="prenom"><span class="err" data-e="prenom"></span></div>
<div class="field full"><label for="email">Adresse e-mail</label><input id="email" name="email" type="email"><span class="err" data-e="email"></span></div>
<div class="field full"><label for="sujet">Sujet</label><input id="sujet" name="sujet"><span class="err" data-e="sujet"></span></div>
<div class="field full"><label for="message">Message</label><textarea id="message" name="message" rows="6"></textarea><span class="err" data-e="message"></span></div>
<div class="field full"><label><input type="checkbox" name="consent"> J'accepte que mes données soient utilisées pour répondre à ma demande.</label><span class="err" data-e="consent"></span></div>
<div class="field full"><button class="btn" type="submit">Envoyer</button></div>
</form>
<div class="ok" id="confirm">Merci ! Votre message a bien été envoyé.</div>
</div></div>
</main>
<div id="site-footer"></div>
<script src="js/main.js"></script>
</body>
</html>
